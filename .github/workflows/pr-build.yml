name: PR build

on:
  pull_request:
    branches: [ main ]
  # The release workflow dispatches this for its repo.json PR, which can't trigger it otherwise
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # Buildingway.Build from GitHub Packages

jobs:

  # Builds against the Dalamud pinned in .github/dalamud.env
  pr-build:
    uses: Cellar-Mander/buildingway-ci/.github/workflows/pr-build.yml@98738d9d6f9294110f8ff7317f2300e3b1a52e72 # v0.9.0
    with:
      plugin: Jaunt
